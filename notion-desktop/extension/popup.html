<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body{width:320px;margin:0;padding:18px;background:#101914;color:#ecf2e9;font:14px/1.45 system-ui,sans-serif}h1{font-size:17px;margin:0 0 10px}.status{color:#b5f178;font-weight:700}.detail{color:#adbaae}button{margin:8px 8px 0 0;padding:8px 12px;border:1px solid #46594d;border-radius:6px;background:#18241d;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}textarea{box-sizing:border-box;width:100%;min-height:86px;margin-top:12px;padding:9px;border:1px solid #46594d;border-radius:6px;background:#18241d;color:inherit;font:inherit}.result{white-space:pre-wrap;max-height:180px;overflow:auto;color:#d5e2d5}</style>
  <title>PlazCode Web Agents</title>
</head>
<body><h1>KI-Agent in diesem Tab</h1><div id="state" class="status">Prüfe…</div><p id="detail" class="detail"></p><button id="enable">Agent freigeben</button><textarea id="task" placeholder="Beschreibe die Aufgabe für den geöffneten Ort in Roblox Studio…"></textarea><button id="run" disabled>Direkt starten</button><button id="options">Einstellungen</button><p id="result" class="result" role="status"></p><script src="popup.js"></script></body>
</html>
