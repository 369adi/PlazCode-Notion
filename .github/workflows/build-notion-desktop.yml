name: Build PlazCode Notion Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "notion-desktop/**"
      - ".github/workflows/build-notion-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        shell: pwsh
        run: |
          Expand-Archive -Path PlazCode-source-1.19.36.zip -DestinationPath build-src -Force
          # Run from the repository root with --directory: inside a repo subfolder
          # git apply would silently skip every file.
          git apply --verbose --whitespace=nowarn --directory=build-src/PlazCode notion-desktop/plazcode-notion.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch failed" }
          if (-not (Select-String -Path build-src/PlazCode/agent/src/desktop.html -Pattern 'plazcode-notion-theme' -Quiet)) { throw "Notion UI patch missing" }
          if (-not (Test-Path build-src/PlazCode/agent/src/notion_mcp.rs)) { throw "notion_mcp.rs missing" }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build-src/PlazCode/agent

      - name: Build PlazCode.exe
        working-directory: build-src/PlazCode/agent
        run: cargo build --release --locked

      - name: Package single PlazCode-Notion.exe
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content notion-desktop/VERSION -Raw).Trim()
          Expand-Archive -Path PlazCode-1.19.36.zip -DestinationPath pkg -Force
          Copy-Item build-src/PlazCode/agent/target/release/PlazCode.exe pkg/PlazCode/PlazCode.exe -Force
          Copy-Item notion-desktop/README.md pkg/PlazCode/PLAZCODE-NOTION.md -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path pkg/PlazCode).Path, "$PWD/app.zip", [System.IO.Compression.CompressionLevel]::Optimal, $false)
          "[assembly: System.Reflection.AssemblyVersion(`"$v.0`")]" | Set-Content Version.cs
          $iconArg = @()
          try {
            Add-Type -AssemblyName System.Drawing
            $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path pkg/PlazCode/PlazCode.exe).Path)
            $fs = [System.IO.File]::Create("$PWD/app.ico"); $ico.Save($fs); $fs.Close()
            $iconArg = @('/win32icon:app.ico')
          } catch { Write-Warning "Icon extraction failed: $_" }
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $exe = "PlazCode-Notion.exe"
          & $csc /nologo /target:winexe /optimize+ "/out:$exe" @iconArg /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Windows.Forms.dll /resource:app.zip,app.zip "$PWD\notion-desktop\launcher\Launcher.cs" "$PWD\Version.cs"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: PlazCode-Notion-windows
          path: ${{ steps.pkg.outputs.exe }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "notion-desktop-v${{ steps.pkg.outputs.version }}"
          $exe = "${{ steps.pkg.outputs.exe }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "PlazCode Notion ${{ steps.pkg.outputs.version }}" --notes-file notion-desktop/README.md --latest
          }